[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin2text"
version = "0.1.0"
description = "Local media processing with replaceable source and ASR providers"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "httpcore>=1,<2", "pydantic>=2,<3", "psutil"]

[project.optional-dependencies]
f2 = ["f2"]

[tool.setuptools.packages.find]
where = ["src"]
